name: 13.60 integration validation

on:
  push:
    branches:
      - develop/13.60
      - feature/13.60-hv-provider-scaffold
  pull_request:
    branches:
      - develop/13.60

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run complete 13.60 regression suite
        run: make verify-13-60
